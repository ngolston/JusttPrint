<!DOCTYPE html>
<html lang="en" class="server-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JusttPrint - 3D Model Manager</title>
  <meta name="theme-color" content="#081017">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JusttPrint">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="color-scheme.js"></script>
  <link rel="stylesheet" href="web-build/app.css">
  <!-- Puter.js is loaded dynamically only when needed to avoid unnecessary socket.io connections -->
</head>

<body class="server-mode">
  <!-- The React screens and the JusttPrint 5 shell (src/web/main.tsx). First, so the skip link and navigation come first in the Tab order. -->
  <div id="react-root"></div>
  <!-- The details column (the shell shows it on the right, or as a drawer). Its filter parts move
       into the library header's Filter popover and chips, the job progress into the shell sidebar
       (src/web/shell/adopt.ts). -->
  <div class="sidebar" role="complementary" aria-label="Model details">
    <!-- Scan and thumbnail job progress: React (src/web/scan/Progress.tsx) -->
    <div id="sidebar-progress-slot" style="display: contents"></div>
    <!-- The current filter strip: React (src/web/filters/Sidebar.tsx). -->
    <div id="current-filter">
      <div id="current-filter-body"></div>
      <div id="current-filter-actions" style="display: contents"></div>
    </div>
    <div class="filter-section">
      <div class="filter-pinned">
      <!-- Search, notes and sort: React (src/web/filters/Sidebar.tsx) -->
      <div id="sidebar-search-slot" style="display: contents"></div>
      <!-- Folders: React (src/web/folders/FolderTree.tsx) -->
      <div id="sidebar-folders-slot" style="display: contents"></div>
      </div>
      <!-- More filters: React (src/web/filters/Sidebar.tsx) -->
      <div id="filter-stack-toggle-slot" style="display: contents"></div>
      <div id="filter-stack" class="filter-stack">
      <!-- Filters: React (src/web/filters/Sidebar.tsx) -->
      <div id="sidebar-filters-slot" style="display: contents"></div>

      <div class="form-group">
        <button id="edit-mode-toggle">Multi-Edit Mode</button>
      </div>
      </div>
    </div>

    <div id="model-details" class="model-details hidden">
      <h3>Model Details</h3>
      <!-- Desktop: preview, identity, actions and the sections below in the JusttPrint 5 order: React (src/web/details/ModelDetailsPanel.tsx) -->
      <div id="details-hero-slot" style="display: contents"></div>
      <button type="button" id="enter-multi-edit-button" class="full-width-button">Enter Multi-Edit Mode</button>
      <!-- Print status: React (src/web/print/PrintHistory.tsx) -->
      <div id="details-print-slot" style="display: contents"></div>
      <!-- Name: React (src/web/details/DetailsFields.tsx) -->
      <div id="details-name-slot" style="display: contents"></div>
      <div class="form-group" id="details-path-group">
        <label for="model-path">Path:</label>
        <div class="path-tree-field">
          <div id="path-tree-container" class="path-tree-container"></div>
          <!-- Reveal in folders: React (src/web/details/DetailsPath.tsx) -->
          <div id="details-reveal-slot" style="display: contents"></div>
        </div>
      </div>
      <!-- Source, designer, parent model, license and tags: React (src/web/details/DetailsFields.tsx) -->
      <div id="details-fields-slot" style="display: contents"></div>
      <!-- Tags: React (src/web/details/DetailsFields.tsx) -->
      <div id="details-tags-slot" style="display: contents"></div>
      <!-- Notes: React (src/web/details/DetailsNotes.tsx) -->
      <div id="details-notes-slot" style="display: contents"></div>
      <!-- Print history: React (src/web/print/PrintHistory.tsx) -->
      <div id="details-history-slot" style="display: contents"></div>
    </div>

    <div id="bundle-details" class="model-details bundle-details hidden">
      <h3 id="bundle-details-title"></h3>
      <!-- Title (in the header above) and body: React (src/web/details/BundleDetails.tsx) -->
      <div id="bundle-details-slot" style="display: contents"></div>
    </div>
    <div id="multi-edit-panel" class="model-details hidden" aria-label="Multi-edit">
      <!-- Header and body: React (src/web/details/MultiEditPanel.tsx) -->
      <div id="multi-edit-slot" style="display: contents"></div>
    </div>
  </div>
  <!-- Folder rail contents and the folder popover: React (src/web/folders/FolderTree.tsx) -->
  <aside id="folder-rail" class="folder-rail hidden" aria-label="Folder tree" hidden></aside>
  <div class="main-content">
    <!-- The library's main landmark; it is a plain region while a page covers it (src/web/shell/AppShell.tsx). -->
    <div class="library-main" id="library-content" role="main" aria-label="Model library">
      <div class="grid-view-selector">
        <div id="folder-rail-toggle-slot" style="display: contents"></div>
        <!-- View buttons, tile size and Show/Hide columns: React (src/web/grid/GridToolbar.tsx) -->
        <div id="grid-toolbar-slot" style="display: contents"></div>
      </div>
      <div class="file-grid"></div>
    </div>
  </div>
  <div id="loading-overlay">
    <div class="spinner">
      <div class="loader"></div>
      <p>Loading model database...</p>
      <button id="continue-anyways"><strong>CONTINUE ANYWAYS</strong><br><i>MAY IMPACT PERFORMANCE</i></button>
    </div>
  </div>

  <script src="slicer-protocol.js"></script>
  <script src="step-assembly.js"></script>
  <script src="stl-sanity.js"></script>

  <!-- React screens (src/web/, mounted by main.tsx) -->
  <script type="module" src="web-build/app.js"></script>
</body>
</html>
