# Local test setup: builds the image from this checkout and runs it on this computer.
#
#   npm run docker:local          build and start (http://localhost:5055)
#   npm run docker:local:logs     follow the server log
#   npm run docker:local:down     stop and remove the container (data is kept)
#
# Settings come from ~/justtprint-test/local.env (models folder, data folder, password, port).
name: justtprint

services:
  justtprint:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: justtprint:local
    container_name: justtprint-local
    ports:
      - "${JUSTTPRINT_HOST_PORT:-5055}:5000"
    volumes:
      - "${JUSTTPRINT_DATA:?set JUSTTPRINT_DATA in local.env}:/root/.config/justtprint"
      - "${JUSTTPRINT_MODELS:?set JUSTTPRINT_MODELS in local.env}:/mnt/models:${JUSTTPRINT_MODELS_MODE:-ro}"
    environment:
      - STL_HOME=/mnt/models
      - JUSTTPRINT_PASSWORD=${JUSTTPRINT_PASSWORD:?set JUSTTPRINT_PASSWORD in local.env}
    restart: "no"
