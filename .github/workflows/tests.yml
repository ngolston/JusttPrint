name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # The unit tests do not start a browser.
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # The runner's Google Chrome renders thumbnails and drives the browser checks.
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: |
            tests/e2e/.work/server.log
            tests/e2e/.work/*.png
          include-hidden-files: true
          retention-days: 14

  docker:
    # Build the image users pull and smoke-test it (scripts/docker-smoke.js): healthy, logs in,
    # scans the fixture library, serves the web UI, renders a thumbnail, stops cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: justtprint:smoke
          # Reuse unchanged layers (dependencies, Chromium) from earlier runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker smoke test
        run: node scripts/docker-smoke.js justtprint:smoke
