name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # The unit tests do not start a browser.
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # The runner's Google Chrome renders thumbnails and drives the browser checks.
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: |
            tests/e2e/.work/server.log
            tests/e2e/.work/*.png
          include-hidden-files: true
          retention-days: 14
